# No official public HA blueprint schema exists; SchemaStore selects Torque.
# yaml-language-server: $schema=none

blueprint:
  name: Критичне сповіщення про повітряну загрозу
  description: >-
    Надсилає критичне мобільне сповіщення про кожну небезпеку, виявлену
    пристроєм Повітряної загрози. На iOS потрібен дозвіл на критичні сповіщення.
  domain: automation
  author: Denys Dovhan
  source_url: >-
    https://github.com/denysdovhan/ha-aerial-danger/blob/main/blueprints/aerial_danger_critical_notification.yaml
  homeassistant:
    min_version: "2024.6.0"
  input:
    aerial_danger_device:
      name: Пристрій Повітряної загрози
      selector:
        device:
          filter:
            - integration: aerial_danger
    notify_entities:
      name: Телефони для сповіщення
      description: >-
        Виберіть одну або декілька сутностей сповіщення для ваших телефонів 
        (шукайте ті, що починаються на notify.mobile_app_...).
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify
    notification_cooldown:
      name: Затримка між сповіщеннями
      description: >-
        Ігнорувати нові спрацювання протягом цього часу після надсилання
        сповіщення.
      default:
        minutes: 5
      selector:
        duration: {}

triggers:
  - trigger: aerial_danger.danger
    target:
      device_id: !input aerial_danger_device

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_entities
    data:
      title: Повітряна загроза
      message: >-
        {{ trigger.to_state.attributes.matched_area }} —
        {{ trigger.to_state.attributes.matched_message }}
      data:
        push:
          interruption-level: critical
        ttl: 0
        priority: high
        channel: alarm_stream
  - delay: !input notification_cooldown

mode: single
max_exceeded: silent
